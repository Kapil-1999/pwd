<div class="col-md-12">
    <div class="card">
      <div class="card-header">
        <span>Activity Check</span>

      </div>
      <div class="card-body">
        <ngx-charts-bar-vertical [results]="chartData" [gradient]="gradient" [xAxis]="showXAxis"

        </ngx-charts-bar-vertical>
      </div>
    </div>
  </div>
