<div class="card">
    <div class="card-header">
        History Track
    </div>
    <div class="card-body">
        <form [formGroup]="historyForm" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm mb-1">Designation</label>
                    <ngx-select-dropdown 
                        [config]="config" 
                        [options]="desigantionList" 
                        formControlName="designation"
                        (change)="onChangeDesi($event)" 
                        class="w-full">
                    </ngx-select-dropdown>
                </div>
                <div>
                    <label class="block text-sm mb-1">User</label>
                    <ngx-select-dropdown 
                        [config]="config" 
                        [options]="userList" 
                        formControlName="user" 
                        class="w-full">
                    </ngx-select-dropdown>
                </div>
            </div>
    
            <div>
                <label class="block text-sm mb-1">Time Format</label>
                <select class="w-full border rounded-md px-3 py-2" 
                        formControlName="timeformat" 
                        (change)="timecheck($event)">
                    <option *ngFor="let item of selectDate" [value]="item.id">{{ item.dateValue }}</option>
                </select>
            </div>
    
            <ng-container *ngIf="customDate">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm mb-1">From Date</label>
                        <input type="datetime-local" 
                               class="w-full border rounded-md px-3 py-2"
                               formControlName="fromDate"
                               placeholder="dd/MM/yyy" />
                    </div>
                    <div>
                        <label class="block text-sm mb-1">To Date</label>
                        <input type="datetime-local" 
                               class="w-full border rounded-md px-3 py-2"
                               formControlName="toDate"
                               placeholder="dd/MM/yyy" />
                    </div>
                </div>
            </ng-container>
    
            <div class="grid grid-cols-2 gap-4 mt-4">
                <button type="submit" 
                        class="w-full py-2 bg-green-500 text-white rounded-md hover:bg-green-600 transition-colors">
                    Submit
                </button>
                <button type="button" 
                        class="w-full py-2 bg-red-500 text-white rounded-md hover:bg-red-600 transition-colors">
                    Cancel
                </button>
            </div>
        </form>
    </div>
</div>
