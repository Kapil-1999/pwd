
<div class="profile-part">
    <div class="login bg-white shadow-lg rounded-lg overflow-hidden">
      <!-- Profile Picture -->
      <div class="relative">
        <img
          class="w-full h-40 object-cover"
          src="assets/images/no-image.png"
          alt="Cover Photo"
        />
        <img
          class="w-24 h-24 rounded-full border-4 border-white absolute top-28 left-1/2 transform -translate-x-1/2"
          [src]="imgUrl + userData?.img_path"
          alt="Profile Picture"
        />
      </div>
    
      <!-- User Details -->
      <div class="text-center p-6 mt-4">
        <h1 class="text-xl font-semibold text-gray-800">{{userData?.full_name}}</h1>
        <p class="text-gray-600">{{userData?.designation_name}}</p>
        <p class="text-sm text-gray-500 mt-2">
          Department: {{userData?.department_name}}
        </p>
      </div>
    
      <!-- User Info -->
      <div class="px-6 pb-6">
        <div class="flex items-center justify-between text-gray-700 mb-4">
          <div>
            <p class="text-sm">Phone</p>
            <p class="font-medium">{{userData?.contact_no}}</p>
          </div>
          <div>
            <p class="text-sm">Email</p>
            <p class="font-medium">{{userData?.email_id}}</p>
          </div>
        </div>
        <div class="flex justify-center space-x-4">
          <button
            class="px-4 py-2 bg-red-500 text-white text-sm rounded-md hover:bg-red-600" (click)="logout()"
          >
            Logout
          </button>
        </div>
      </div>
    </div>
</div>
