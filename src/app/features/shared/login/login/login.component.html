<div class="min-h-screen w-full bg-cover bg-center bg-no-repeat flex justify-center md:justify-end items-center" style="background-image: url('assets/images/banner-1.jpg')">
  <div class="flex justify-center items-center p-4 md:mr-32">
    <div class="w-full sm:w-[350px] md:w-[350px] bg-white rounded-xl shadow-xl p-8 md:p-10">
      <div class="flex justify-center">
        <img class="h-28 w-auto object-contain" src="assets/images/pwd-logo-png.png" alt="PWD Logo">
      </div>
      
      <h3 class="text-3xl font-bold text-center mb-8">PWD</h3>
      
      <form class="space-y-6" [formGroup]="loginForm">
        <div>
          <input 
            type="text" 
            formControlName="userName" 
            placeholder="Username"
            class="w-full px-4 py-3 rounded-full border border-gray-500 focus:outline-none "
          >
          @if(loginForm.get('userName')?.invalid && loginForm.get('userName')?.touched) {
            <div class="text-red-500 text-sm mt-1 px-3">Username is required</div>
          }
        </div>

        <div class="relative">
          <input 
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password" 
            placeholder="Password"
            class="w-full px-4 py-3 rounded-full border border-gray-500 focus:outline-none "
          >
          <button 
            type="button"
            class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700"
            (click)="showPassword = !showPassword"
          >
            <i class="fa" [ngClass]="{'fa-eye': !showPassword, 'fa-eye-slash': showPassword}"></i>
          </button>
          @if(loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
            @if(loginForm.get('password')?.errors?.['required']) {
              <div class="text-red-500 text-sm mt-1 px-3">Password is required</div>
            }
          }
        </div>

        <button 
          type="button"
          (click)="submit(loginForm.value)"
          class="w-full py-3 px-4 rounded-full bg-teal-600 text-white font-medium  focus:outline-none  shadow-md transition-colors duration-200"
        >
          {{ isloading ? 'Logging in...' : 'Log in' }}
        </button>
      </form>
    </div>
  </div>
</div>
