<div class="min-h-full">
  <nav class="bg-blue-500 text-white fixed top-0 left-0 w-full z-50 shadow-md py-1">
    <div class="mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex h-16 items-center justify-between">
        <div class="flex items-center">
          <div class="shrink-0">
            <a routerLink="/admin/dashboard/home">
              <img class="logo-part h-12 w-auto" src="assets/images/pwd-logo-png.png" alt="">
            </a>
          </div>
          <div class="lg:block hidden">
            <div class="ml-10 flex items-baseline space-x-4">
              <div *ngFor="let menuValue of menuListData" class="relative group">
                <a *ngIf="!menuValue.menuList?.length" [routerLink]="menuValue.url"
                  class="menu-link rounded-md px-3 py-2 hover:bg-gray-700 hover:text-white"
                  [ngClass]="{'bg-gray-700 text-white': menuValue.isActive, 'hover:bg-gray-700 hover:text-white': !menuValue.isActive}"
                  (click)="toggleDropdown(menuValue, $event)">
                  {{ menuValue.module_name }}
                </a>
                <div *ngIf="menuValue.menuList?.length">
                  <a class="rounded-md px-3 py-2 hover:bg-gray-700 hover:text-white cursor-pointer flex items-center"
                    [ngClass]="{'bg-gray-700 text-white': menuValue.isActive, 'hover:bg-gray-700 hover:text-white': !menuValue.isActive}"
                    (click)="toggleDropdown(menuValue, $event)">
                    <span class="flex-1 menu-link">{{ menuValue.module_name }}</span>
                    <span class="ml-2 transition-transform" [ngClass]="{ 'rotate-180': menuValue.is_open }">
                      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="size-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                      </svg>
                    </span>
                  </a>
                  <div class="absolute left-0 z-10  mt-2 w-[15rem] rounded-md bg-gray-800 shadow-lg"
                    [ngClass]="{ 'hidden': !menuValue.is_open }">
                    <a *ngFor="let subNav of menuValue?.menuList" [routerLink]="subNav.url"
                      class="menu-link block px-4 py-2  hover:bg-gray-700 hover:text-white"
                      [ngClass]="{'bg-blue-500 text-white': subNav.isActive, 'hover:bg-gray-700 hover:text-white': !subNav.isActive}"
                      (click)="toggleDropdown(subNav, $event)">
                      {{ subNav.menu_name }}
                    </a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        
        <!-- Update the user info section -->
        <div class="lg:block hidden">
          <div class="ml-4 flex items-center md:ml-6">
            <div class="text-white mr-4">
              <div class="text-base font-medium">
                Login Name : {{userDetails.full_name}}
              </div>
              <div class="text-sm">
                Department : {{userDetails.department_name}}
              </div>
            </div>
            <div class="relative inline-block text-left">
              <div>
                <button type="button" (click)="togglePopup()"
                  class="relative flex max-w-xs items-center rounded-full bg-gray-800 text-sm focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-gray-800"
                  id="user-menu-button" aria-expanded="false" aria-haspopup="true">
                  <span class="absolute -inset-1.5"></span>
                  <span class="sr-only">Open user menu</span>
                  <img class="size-12 rounded-full" [src]="imgUrl + userDetails.img_path" alt="">
                </button>
              </div>

              <div *ngIf="showPopup"
                class="absolute right-0 z-10 mt-2 w-96 origin-top-right divide-y divide-gray-100 rounded-md bg-white shadow-lg ring-1 ring-black/5 focus:outline-none"
                role="menu" aria-orientation="vertical" aria-labelledby="menu-button" tabindex="-1">
               <profile></profile>
              </div>
            </div>

          </div>
        </div>
        <div class="-mr-2 flex md:hidden">
          <!-- Mobile menu button -->
          <div class="lg:hidden">
            <button type="button" (click)="onShowMobileMenu($event)"
              class="inline-flex items-center justify-center rounded-md p-2 text-white hover:bg-blue-600 focus:outline-none"
              aria-controls="mobile-menu" aria-expanded="false">
              <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
              </svg>
            </button>
          </div>
          
          <!-- Move the mobile menu container here -->
          <!-- Mobile menu container -->
          <div id="mobile-menu" 
            class="lg:hidden fixed top-16 left-0 w-full h-[calc(100vh-4rem)] bg-blue-500 overflow-y-auto transform transition-transform duration-200 ease-in-out"
            [ngClass]="{'translate-x-0': showMobileMenu, '-translate-x-full': !showMobileMenu}">
            <div class="flex flex-col space-y-2 p-4">
              <div *ngFor="let menuValue of menuListData" class="relative">
                <a *ngIf="!menuValue.menuList?.length" [routerLink]="menuValue.url"
                  class="block w-full text-white px-4 py-2 rounded hover:bg-blue-600"
                  [ngClass]="{'bg-blue-700': menuValue.isActive}"
                  (click)="handleMobileMenuClick(menuValue, $event)">
                  {{ menuValue.module_name }}
                </a>
                <div *ngIf="menuValue.menuList?.length" class="w-full">
                  <button class="w-full text-white px-4 py-2 rounded hover:bg-blue-600 flex items-center justify-between"
                    [ngClass]="{'bg-blue-700': menuValue.isActive}"
                    (click)="toggleDropdown(menuValue, $event)">
                    <span>{{ menuValue.module_name }}</span>
                    <svg [ngClass]="{ 'rotate-180': menuValue.is_open }" class="size-5 transition-transform"
                      xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                      stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                    </svg>
                  </button>
                  <div class="pl-4 mt-2 space-y-1" [ngClass]="{ 'hidden': !menuValue.is_open }">
                    <a *ngFor="let subNav of menuValue?.menuList" [routerLink]="subNav.url"
                      class="block w-full text-white px-4 py-2 rounded hover:bg-blue-600"
                      [ngClass]="{'bg-blue-700': subNav.isActive}"
                      (click)="handleMobileMenuClick(subNav, $event)">
                      {{ subNav.menu_name }}
                    </a>
                  </div>
                </div>
              </div>
            </div>
          
          <!-- Mobile user info -->
          <div class="border-t border-blue-400 mt-4 p-4">
            <div class="flex items-center">
              <div class="shrink-0">
                <img class="size-10 rounded-full" [src]="imgUrl + userDetails.img_path" alt="">
              </div>
              <div class="ml-3 text-white">
                <div class="text-base font-medium">{{userDetails.full_name}}</div>
                <div class="text-sm opacity-75">{{userDetails.department_name}}</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    </div>
  </nav>
  <main>
    <div class="pt-16">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
